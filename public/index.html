<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Inventario Depósito</title>
    <!-- Tailwind CSS para que se vea bien en celulares -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        html,
        body {
            width: 100%;
            max-width: 100%;
            overflow-x: hidden;
        }

        body {
            touch-action: pan-y;
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-800">

    <div class="w-full min-w-0 max-w-md mx-auto p-4 min-h-screen pb-20">
        <!-- Título -->
        <header class="mb-4 text-center">
            <h1 class="text-2xl font-bold text-blue-600">📦 BIOSALUD - Inventario</h1>
            <p class="text-sm text-gray-500">Sistema en vivo - Depósito</p>
        </header>

        <!-- Buscador -->
        <div class="mb-4">
            <input type="text" id="buscador" placeholder="Buscar por artículo, código de barras o ubicación..."
                class="w-full p-3 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 text-base bg-white">
        </div>

        <!-- Contador de resultados -->
        <div class="text-xs text-gray-500 mb-2 px-1" id="contador">Cargando productos...</div>

        <!-- Lista de Productos -->
        <div id="lista-productos" class="space-y-3">
            <!-- Los productos se inyectan acá con JavaScript -->
        </div>
    </div>

    <script>
        let productosGlobales = [];
        const camposStock = [
            { clave: 'stockDeposito', etiqueta: 'Depósito' },
            { clave: 'stockPalets', etiqueta: 'Palets' },
            { clave: 'stockPicking', etiqueta: 'Picking' }
        ];

        async function cargarInventario() {
            try {
                const res = await fetch('/api/inventario');
                if (!res.ok) throw new Error('No se pudo cargar el inventario.');
                productosGlobales = await res.json();
                filtrarProductos();
            } catch (error) {
                document.getElementById('contador').innerText = 'Error al cargar los datos.';
                console.error(error);
            }
        }

        function mostrarProductos(productos) {
            const contenedor = document.getElementById('lista-productos');
            const contador = document.getElementById('contador');
            contenedor.innerHTML = '';
            contador.innerText = `Mostrando ${productos.length} productos`;

            if (productos.length === 0) {
                contenedor.innerHTML = '<p class="text-center text-gray-500 py-6">No se encontraron productos.</p>';
                return;
            }

            productos.forEach(p => {
                const card = document.createElement('article');
                card.className = 'bg-white p-3 rounded-xl shadow-sm border border-gray-200';
                const encabezado = document.createElement('div');
                encabezado.className = 'flex justify-between items-start gap-2 mb-1 min-w-0';

                const identificadores = document.createElement('div');
                identificadores.className = 'flex min-w-0 max-w-[65%] flex-wrap items-center gap-2';

                const codigoBarra = document.createElement('span');
                codigoBarra.className = 'min-w-0 break-all text-xs font-semibold bg-blue-100 text-blue-800 px-2 py-0.5 rounded';
                codigoBarra.textContent = p.codigoBarra || '';
                identificadores.appendChild(codigoBarra);

                const id = document.createElement('span');
                id.className = 'min-w-0 break-all text-xs text-gray-500';
                id.textContent = p.id ? `${p.id}` : '';
                identificadores.appendChild(id);

                const ubicacion = document.createElement('span');
                ubicacion.className = 'min-w-0 text-right break-words text-xs font-bold bg-green-100 text-green-800 px-2 py-0.5 rounded';
                ubicacion.textContent = p.ubicacion || 'S/U';
                encabezado.append(identificadores, ubicacion);

                const articulo = document.createElement('h2');
                articulo.className = 'break-words font-bold text-gray-900 text-sm mt-1';
                articulo.textContent = p.articulo || '';

                const detalles = document.createElement('p');
                detalles.className = 'break-words text-xs text-gray-500 mt-0.5';
                detalles.textContent = [p.subfamilia, p.presentacion].filter(Boolean).join(' - ');

                const stocks = document.createElement('div');
                stocks.className = 'mt-2 pt-2 border-t border-gray-100 grid grid-cols-3 items-center text-xs gap-2';
                camposStock.forEach(campo => {
                    const stock = document.createElement('span');
                    stock.className = 'text-center text-gray-600';
                    stock.textContent = `${campo.etiqueta === 'Depósito' ? 'Depo' : campo.etiqueta}: `;
                    const cantidad = document.createElement('b');
                    cantidad.textContent = p[campo.clave] ?? 0;
                    stock.appendChild(cantidad);
                    stocks.appendChild(stock);
                });
                const total = document.createElement('span');
                total.className = 'font-bold text-blue-600 text-sm';
                total.textContent = `Total: ${p.stockTotal ?? 0}`;

                const pie = document.createElement('div');
                pie.className = 'mt-2 flex items-center justify-between gap-2';
                const editar = document.createElement('button');
                editar.type = 'button';
                editar.className = 'px-3 py-1 text-sm font-semibold text-blue-700 border border-blue-200 rounded-lg hover:bg-blue-50';
                editar.textContent = 'Editar';
                editar.addEventListener('click', () => abrirEditor(p, stocks, pie, card));
                pie.append(total, editar);

                card.append(encabezado, articulo, detalles, stocks, pie);
                contenedor.appendChild(card);
            });
        }

        function abrirEditor(producto, stocks, pie, card) {
            const formulario = document.createElement('form');
            formulario.className = 'mt-2 pt-2 border-t border-gray-100 space-y-3';
            const entradas = {};

            camposStock.forEach(campo => {
                const etiqueta = document.createElement('label');
                etiqueta.className = 'block text-sm font-medium text-gray-700';
                etiqueta.textContent = campo.etiqueta;

                const entrada = document.createElement('input');
                entrada.type = 'number';
                entrada.min = '0';
                entrada.step = 'any';
                entrada.required = true;
                entrada.value = producto[campo.clave] ?? 0;
                entrada.className = 'mt-1 w-full p-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500';
                etiqueta.appendChild(entrada);
                formulario.appendChild(etiqueta);
                entradas[campo.clave] = entrada;
            });

            const totalCalculado = document.createElement('p');
            totalCalculado.className = 'text-sm font-semibold text-blue-700';
            const actualizarTotal = () => {
                const total = camposStock.reduce((suma, campo) => suma + (entradas[campo.clave].valueAsNumber || 0), 0);
                totalCalculado.textContent = `Total calculado: ${total}`;
            };
            Object.values(entradas).forEach(entrada => entrada.addEventListener('input', actualizarTotal));
            actualizarTotal();
            formulario.appendChild(totalCalculado);

            const mensajeError = document.createElement('p');
            mensajeError.className = 'text-sm text-red-600';
            mensajeError.hidden = true;
            formulario.appendChild(mensajeError);

            const acciones = document.createElement('div');
            acciones.className = 'flex gap-2';
            const guardar = document.createElement('button');
            guardar.type = 'submit';
            guardar.className = 'px-3 py-2 text-sm font-semibold text-white bg-blue-600 rounded-lg hover:bg-blue-700 disabled:opacity-50';
            guardar.textContent = 'Guardar';
            const cancelar = document.createElement('button');
            cancelar.type = 'button';
            cancelar.className = 'px-3 py-2 text-sm font-semibold text-gray-700 bg-gray-100 rounded-lg hover:bg-gray-200';
            cancelar.textContent = 'Cancelar';
            cancelar.addEventListener('click', () => {
                formulario.remove();
                stocks.classList.remove('hidden');
                pie.classList.remove('hidden');
            });
            acciones.append(guardar, cancelar);
            formulario.appendChild(acciones);

            formulario.addEventListener('submit', async evento => {
                evento.preventDefault();
                guardar.disabled = true;
                cancelar.disabled = true;
                mensajeError.hidden = true;
                try {
                    const res = await fetch(`/api/inventario/${encodeURIComponent(producto.fila)}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            stockDeposito: entradas.stockDeposito.valueAsNumber,
                            stockPalets: entradas.stockPalets.valueAsNumber,
                            stockPicking: entradas.stockPicking.valueAsNumber
                        })
                    });
                    const resultado = await res.json();
                    if (!res.ok) throw new Error(resultado.error || 'No se pudieron guardar las cantidades.');

                    Object.assign(producto, resultado);
                    const filtro = document.getElementById('buscador').value;
                    filtrarProductos(filtro);
                } catch (error) {
                    mensajeError.textContent = error.message;
                    mensajeError.hidden = false;
                    guardar.disabled = false;
                    cancelar.disabled = false;
                }
            });

            stocks.classList.add('hidden');
            pie.classList.add('hidden');
            card.insertBefore(formulario, pie);
            entradas.stockDeposito.focus();
        }

        function filtrarProductos(texto = document.getElementById('buscador').value) {
            const consulta = texto.toLowerCase();
            const filtrados = productosGlobales.filter(p =>
                [p.articulo, p.sku, p.ubicacion, p.codigoBarra, p.id]
                    .some(valor => String(valor || '').toLowerCase().includes(consulta))
            );
            mostrarProductos(filtrados);
        }

        document.getElementById('buscador').addEventListener('input', evento => {
            filtrarProductos(evento.target.value);
        });

        // Cargar al iniciar
        cargarInventario();
    </script>
</body>
</html>
